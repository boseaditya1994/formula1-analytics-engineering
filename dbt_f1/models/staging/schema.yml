version: 2

models:
  - name: stg_source_records
    description: Typed, scoped view over the current-state Jolpica RAW records.
    columns:
      - name: dataset
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['races', 'results', 'qualifying', 'sprint', 'driverstandings', 'constructorstandings']
      - name: business_key
        tests: [not_null]
      - name: season
        tests: [not_null]
      - name: round_number
        tests: [not_null]
      - name: payload_hash
        tests: [not_null]
