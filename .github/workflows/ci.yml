name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.9.x"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run --frozen ruff check .

      - name: Python tests
        run: uv run --frozen pytest

      - name: dbt compile (offline)
        run: uv run --frozen python scripts/run_dbt.py parse --offline
