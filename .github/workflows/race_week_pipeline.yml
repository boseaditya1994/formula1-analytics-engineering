name: Race-week pipeline

on:
  schedule:
    # Friday through Sunday, twice per hour and offset from top-of-hour Actions load.
    - cron: "17,47 * * * 5,6,0"
  workflow_dispatch:

jobs:
  race-week:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: f1-snowflake-writer
      cancel-in-progress: false
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.9.x"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Write service-user private key
        run: |
          umask 077
          printf '%s' "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > "$RUNNER_TEMP/f1_pipeline_svc.p8"
          echo "SNOWFLAKE_PRIVATE_KEY_FILE=$RUNNER_TEMP/f1_pipeline_svc.p8" >> "$GITHUB_ENV"

      - name: Refresh current race and build marts when source data is published
        run: uv run --frozen python scripts/race_week_pipeline.py
