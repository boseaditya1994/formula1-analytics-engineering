[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "f1-analytics-engineering"
version = "0.1.0"
description = "Automated daily Formula 1 ingestion and analytics"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28,<1",
  "snowflake-connector-python>=3,<5",
  "dbt-snowflake>=1.10,<2",
  "pydantic-settings>=2,<3",
  "filelock>=3,<4",
  "pyyaml>=6,<7",
  "python-dotenv>=1,<2",
]

[project.scripts]
f1-pipeline = "f1_pipeline.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/f1_pipeline"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
